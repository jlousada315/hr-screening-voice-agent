[project]
name = "hireme-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# System Pythons such as Ubuntu's 3.12.3 predate CPython's async-generator aclose fixes.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["agent", "api"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "agent/tests"]
pythonpath = ["api"]
markers = ["integration: live providers; requires explicit opt-in"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
